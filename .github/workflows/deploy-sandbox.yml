name: Deploy Sandbox

# Builds golery/goapi:sandbox, pushes to Docker Hub, and redeploys Koyeb app goapi-sandbox.
# Trigger manually from Actions → Deploy Sandbox → Run workflow.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub user that owns golery/goapi (golery)
#   DOCKERHUB_TOKEN     Docker Hub access token with push permission
#   KOYEB_API_TOKEN     Koyeb API token (https://app.koyeb.com/settings/api)

on:
  workflow_dispatch:

concurrency:
  group: deploy-goapi-sandbox
  cancel-in-progress: false

env:
  SANDBOX_URL: https://sandbox-api-golery.koyeb.app/

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: golery/goapi:sandbox

      - name: Install and configure Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: Redeploy on Koyeb
        run: |
          koyeb apps resume goapi-sandbox || echo "App not paused; skipping resume"
          koyeb services redeploy goapi-sandbox/main --wait --wait-timeout 5m

      - name: Verify sandbox responds
        run: |
          url="${SANDBOX_URL}"
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS --max-time 5 "$url" | grep -q ping; then
              echo "Sandbox is serving ping at $url"
              exit 0
            fi
            echo "waiting for $url ($((deadline - SECONDS))s left)"
            sleep 5
          done
          echo "Sandbox did not respond with ping at $url within 3 minutes"
          end_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          start_time=$(date -u -d "-15 minutes" +"%Y-%m-%dT%H:%M:%SZ")
          echo "=== Runtime logs (last 15m) ==="
          koyeb services logs goapi-sandbox/main --start-time "$start_time" --end-time "$end_time" || true
          echo "=== Build logs (last 15m) ==="
          koyeb services logs goapi-sandbox/main -t build --start-time "$start_time" --end-time "$end_time" || true
          exit 1
